name: test-3

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  test-3:
    runs-on: ubuntu-latest

    steps:
      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo "Don't mind me, just running this test workflow"
      - name: print out /opt/hca/.settings
        run: cat /opt/hca/.settings
      - name: print out max_sectors_kb
        run: for q in /sys/block/sd*/queue/max_sectors_kb; do echo 512 | sudo tee "$q" > /dev/null; done
