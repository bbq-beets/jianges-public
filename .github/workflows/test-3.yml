name: test-3

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  test-3:
    runs-on: ubuntu-latest

    steps:
      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: ls /sys/block/
      - name: Run a one-line script 2
        run: ls /sys/block/sda
      - name: Run a one-line script 3
        run: ls /sys/block/sda/queue
      - name: Run a one-line script 4
        run: cat /sys/block/sda/queue/max_sectors_kb
      - name: print out max_sectors_kb
        run: for q in /sys/block/sd*/queue/max_sectors_kb; do echo 512 | sudo tee "$q" > /dev/null; done
        - name: after config script
        run: cat /sys/block/sda/queue/max_sectors_kb
